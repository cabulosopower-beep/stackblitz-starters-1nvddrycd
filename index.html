<!DOCTYPE html>
<html lang="pt-BR">
  <head>

    <link rel="manifest" href="manifest.json">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Controle Financeiro</title>

    <link rel="stylesheet" href="css/estilo.css" />
  </head>

  <body>
    <div class="container">

      <section id="telaInicio" class="tela ativa">

        <div class="card">
    
            <h3>🏠 Início</h3>

            <div class="cabecalhoInicio">

              <div id="saudacaoInicio" class="saudacao"></div>
          
              <div id="mesAtualInicio" class="mesAtual"></div>
          
              <div id="quantidadeInicio" class="quantidade"></div>
          
          </div>
    
            <div id="resumoInicio">
    
                <div class="resumo saldo" id="saldoInicio">
                    R$ 0,00
                </div>
    
                <div class="resumo resumoReceitas" id="receitasInicio">
                    R$ 0,00
                </div>
    
                <div class="resumo resumoDespesas" id="despesasInicio">
                    R$ 0,00
                </div>
    
                <div class="resumo resumoPendencias" id="pendenciasInicio">
                    R$ 0,00
                </div>
    
            </div>
    
            <div class="botoes">
    
                <button
                    class="btnSalvar"
                    onclick="mostrarTela('telaLancamentos')">
    
                    ➕ Novo lançamento
    
                </button>
    
                <button
                    class="btnEditar"
                    onclick="mostrarTela('telaResumo')">
    
                    📋 Ver lançamentos
    
                </button>
    
            </div>
    
        </div>
    
    </section>

      <!-- ========================================= -->
      <!-- TÍTULO -->
      <!-- ========================================= -->
      
      <h1>💰 Controle Financeiro</h1>

      <!-- ========================================= -->
      <!-- NOVA MOVIMENTAÇÃO -->
      <!-- ========================================= -->

      <section id="telaLancamentos" class="tela">

      <div class="card">
        <h3>Nova Movimentação</h3>

        <form id="form">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" required />

          <label for="valor">Valor</label>
          <input
    type="text"
    id="valor"
    inputmode="decimal"
    placeholder="Ex: 150,00"
    required
>

          <label for="dataLancamento"> Data </label>

          <input type="date" id="dataLancamento" required />

          <label for="tipo">Tipo</label>

          <select id="tipo">
            <option value="" selected disabled>Selecione...</option>
            <option value="despesa">Despesa</option>
            <option value="receita">Receita</option>        
          </select>

          <label for="categoria">Categoria</label>

          <select id="categoria">
            <option value="" selected disabled>Selecione...</option>
            <option>Alimentação</option>
            <option>Transporte</option>
            <option>Lazer</option>
            <option>Moradia</option>
            <option>Saúde</option>
            <option>Salário</option>
            <option>Outros</option>
          </select>

          <label for="observacao">Observação</label>
          <input type="text" id="observacao" />

          <label for="parcelado">Parcelado?</label>

          <select id="parcelado">
            <option value="" selected disabled>Selecione...</option>
            <option value="nao">Não</option>
            <option value="sim">Sim</option>
          </select>

          <div id="areaParcelas" class="areaParcelas">
            <label for="parcelas"> Quantidade de Parcelas </label>

            <input type="number" id="parcelas" min="2" />
          </div>

          <div class="botoes">
            <button type="submit" class="btnSalvar">Salvar Registro</button>
            <button type="reset" class="btnLimpar">Limpar</button>
          </div>
          
          <div id="mensagem"></div>

        </form>
    </section>

    <section id="telaResumo" class="tela">

      <!-- ========================================= -->
      <!-- FILTROS -->
      <!-- ========================================= -->

      <div class="card">
        <h3>Filtro</h3>

        <div class="filtro">
          <input type="month" id="filtroMes" />
        </div>
      </div>

      <!-- ========================================= -->
      <!-- RESUMO -->
      <!-- ========================================= -->

      <div class="card">
        <h3>Resumo do Mês</h3>

        <div id="totalDespesasMes" class="resumo resumoDespesas">R$ 0,00</div>

        <div id="totalReceitasMes" class="resumo resumoReceitas">R$ 0,00</div>

        <div id="saldoMes" class="resumo saldo">R$ 0,00</div>

        <div id="totalPendenteMes" class="resumo resumoPendencias">R$ 0,00</div>
      </div>

      <!-- ========================================= -->
      <!-- HISTÓRICO -->
      <!-- ========================================= -->

      <div class="card">
        <h3>Histórico</h3>

        <input
          type="text"
          id="buscar"
          class="campoBusca"
          placeholder="Buscar registro..."
        />

        <select id="ordenacao">
          <option value="data">Mais recente</option>

          <option value="maiorValor">Maior valor</option>

          <option value="menorValor">Menor valor</option>

          <option value="pendente">Pendentes primeiro</option>
        </select>

        <div id="lista"></div>
      </div>
    </div>
  </section>
  <section id="telaConfiguracoes" class="tela">

    <div class="card">

        <h3>⚙️ Configurações</h3>




        <button
            class="btnEditar"
            id="btnBackup">

            💾 Fazer Backup

        </button>


        <button
            class="btnEditar"
            id="btnRestaurar">

            📂 Restaurar Backup

            <button
    class="btnEditar"
    id="toggleThemeConfig">

    🌙 Tema escuro

</button>

        </button>


        <input
            type="file"
            id="arquivoBackup"
            accept=".json"
            style="display:none;"
        >

    </div>


    <div class="card">

        <h3>ℹ️ Sobre o aplicativo</h3>

        <p>
            Controle Financeiro
        </p>

        <p>
            Versão 1.0
        </p>

    </div>


</section>

<nav class="menuInferior">

  <button
      class="itemMenu ativo"
      onclick="mostrarTela('telaInicio', this)">

      🏠
      <span>Início</span>

  </button>


  <button
      class="itemMenu"
      onclick="mostrarTela('telaLancamentos', this)">

      💳
      <span>Lançamentos</span>

  </button>


  <button
      class="itemMenu"
      onclick="mostrarTela('telaResumo', this)">

      📊
      <span>Resumo</span>

  </button>


  <button
      class="itemMenu"
      onclick="mostrarTela('telaConfiguracoes', this)">

      ⚙️
      <span>Configurações</span>

  </button>

</nav>

    <script src="js/app.js"></script>

    <script>

      if ("serviceWorker" in navigator) {
      
          navigator.serviceWorker.register("service-worker.js");
      
      }
      
      </script>
      
  </body>
</html>
